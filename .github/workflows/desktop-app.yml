name: Desktop app

on:
  push:
    branches: [claude/epic-wright-y0o6tr, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # lets a version tag publish a release

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and the speech engine
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install faster-whisper
      - name: Run tests (including real speech recognition)
        env:
          LONGFORM_TEST_WHISPER: "1"
        run: python -m unittest discover -s tests -v

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: Longform-Windows.zip
          - name: macOS (Apple Silicon)
            os: macos-14
            artifact: Longform-macOS-AppleSilicon.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install pyinstaller pillow pywebview faster-whisper

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-download -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination packaging/ffmpeg
          packaging/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
      - name: Download FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64)
          mkdir -p packaging/ffmpeg
          for tool in ffmpeg ffprobe; do
            curl -fsSL -o "$tool.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$tool.zip"
            unzip -o "$tool.zip" -d packaging/ffmpeg
          done
          chmod +x packaging/ffmpeg/*
          packaging/ffmpeg/ffmpeg -hide_banner -version | head -1
          otool -L packaging/ffmpeg/ffmpeg | head -20
      - name: Check FFmpeg has the filters the app needs
        shell: bash
        run: |
          for f in drawtext subtitles xfade acrossfade loudnorm sidechaincompress; do
            packaging/ffmpeg/ffmpeg -hide_banner -filters | grep -q " $f " || { echo "missing filter: $f"; exit 1; }
          done
          echo "all filters present"

      - name: Build the app
        run: pyinstaller packaging/longform.spec --noconfirm

      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Longform/Longform.exe -ArgumentList '--self-test','--speech','--report','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: dist/Longform.app/Contents/MacOS/Longform --self-test --speech --report selftest.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Longform -DestinationPath ${{ matrix.artifact }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg && cp -R dist/Longform.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Longform -srcfolder dmg -ov -format UDZO ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
