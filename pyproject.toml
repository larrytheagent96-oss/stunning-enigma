[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "longform"
version = "0.1.0"
description = "Put any videos together into one long-form video, from the command line or a browser editor."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["pywebview>=5", "faster-whisper>=1.0"]

[project.scripts]
longform = "longform.cli:main"

[project.gui-scripts]
longform-app = "longform.desktop:main"

[tool.setuptools]
packages = ["longform"]

[tool.setuptools.package-data]
longform = ["static/*", "fonts/*"]
