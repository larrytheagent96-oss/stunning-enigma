<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Longform</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="logo"></span>longform</div>
    <div class="project-switch">
      <button class="ghost" id="projectsBtn" title="Your projects"></button>
      <input id="projectName" class="project-name" spellcheck="false" aria-label="Project name">
    </div>
    <div class="history">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)"></button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)"></button>
    </div>
    <div id="saveState" class="save-state"></div>
    <div class="spacer"></div>
    <div id="topJobs" class="top-jobs"></div>
    <button class="secondary" id="previewBtn"></button>
    <button class="primary" id="exportBtn"></button>
  </header>

  <aside class="sidebar">
    <nav class="tabs" id="tabs"></nav>
    <div class="panel" id="panel"></div>
  </aside>

  <main class="stage">
    <div class="player" id="player"></div>
    <div class="transport" id="transport"></div>
  </main>

  <aside class="inspector" id="inspector"></aside>

  <section class="timeline-area">
    <div class="timeline-tools" id="timelineTools"></div>
    <div class="timeline-scroll" id="timelineScroll">
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
</div>

<div class="menu" id="projectsMenu" hidden></div>
<div class="modal-backdrop" id="modal" hidden><div class="modal" id="modalBody"></div></div>
<div class="drop-overlay" id="dropOverlay" hidden><div>Drop to add to your library</div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileInput" multiple hidden accept="video/*,image/*,audio/*,.mkv,.mts,.m2ts,.mxf">

<script src="/static/app.js"></script>
</body>
</html>
